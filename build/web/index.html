<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My Flutter Mapbox App</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.7.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.7.0/mapbox-gl.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-storage.js"></script>
    <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoiZGFtb3NzIiwiYSI6ImNtNnRyZzk5MTA2NzkyaXExN2EyNTR1dWsifQ.UdaXenvYULYz6lkQbLU1hg';

      let map;
      let userLocation = null;
      let profilePictureUrl = null;
      let userMarker = null;
      let otherUsersMarkers = {};

      function setProfilePicture(url) {
        profilePictureUrl = url;
        updateUserMarker();
      }

      function updateUserMarker() {
        if (userLocation && profilePictureUrl && map) {
          if (userMarker) {
            userMarker.setLngLat(userLocation);
          } else {
            const el = document.createElement('div');
            el.style.backgroundImage = `url(${profilePictureUrl})`;
            el.style.width = '40px';
            el.style.height = '40px';
            el.style.borderRadius = '50%';
            el.style.backgroundSize = 'cover';
            userMarker = new mapboxgl.Marker({ element: el })
              .setLngLat(userLocation)
              .addTo(map);
          }
        } else if (userMarker) {
          userMarker.remove();
          userMarker = null;
        }
      }

      function updateOtherUsersMarkers(users) {
        for (const uid in otherUsersMarkers) {
          if (!users[uid]) {
            otherUsersMarkers[uid].remove();
            delete otherUsersMarkers[uid];
          }
        }
        for (const uid in users) {
          const { location, photoURL } = users[uid];
          if (otherUsersMarkers[uid]) {
            otherUsersMarkers[uid].setLngLat(location);
          } else {
            const el = document.createElement('div');
            el.style.backgroundImage = `url(${photoURL})`;
            el.style.width = '40px';
            el.style.height = '40px';
            el.style.borderRadius = '50%';
            el.style.backgroundSize = 'cover';
            otherUsersMarkers[uid] = new mapboxgl.Marker({ element: el })
              .setLngLat(location)
              .addTo(map);
          }
        }
      }
      window.updateOtherUsersMarkers = updateOtherUsersMarkers;

      function initializeMap() {
        const tryInitialize = (retries) => {
          const container = document.getElementById('mapbox-map');
          if (container) {
            const defaultLocation = [-122.4194, 37.7749];
            map = new mapboxgl.Map({
              container: 'mapbox-map',
              style: 'mapbox://styles/mapbox/streets-v11',
              center: defaultLocation,
              zoom: 12,
            });
            map.addControl(new mapboxgl.NavigationControl());
            const geolocateControl = new mapboxgl.GeolocateControl({
              positionOptions: { enableHighAccuracy: true },
              trackUserLocation: true,
              showUserHeading: true,
            });
            map.addControl(geolocateControl);

            geolocateControl.on('geolocate', (position) => {
              userLocation = [position.coords.longitude, position.coords.latitude];
              updateUserMarker();
            });

            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                (position) => {
                  userLocation = [position.coords.longitude, position.coords.latitude];
                  map.flyTo({ center: userLocation, zoom: 16, speed: 1.2 });
                  updateUserMarker();
                },
                (error) => {
                  console.error("Error fetching current location:", error);
                },
                { enableHighAccuracy: true },
              );
            }
          } else if (retries > 0) {
            setTimeout(() => tryInitialize(retries - 1), 500);
          } else {
            console.error("Container 'mapbox-map' not found after retries.");
          }
        };
        tryInitialize(10);
      }

      window.addEventListener('load', () => {
        setTimeout(initializeMap, 500);
      });
    </script>
  </head>
  <body>
    <script src="main.dart.js"></script>
  </body>
</html>
