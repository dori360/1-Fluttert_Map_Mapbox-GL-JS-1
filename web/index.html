<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>My Flutter Mapbox App</title>
    <!-- Include Mapbox GL JS CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.7.0/mapbox-gl.css" rel="stylesheet" />
    <!-- Include Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.7.0/mapbox-gl.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      // Set your Mapbox access token.
      mapboxgl.accessToken = 'pk.eyJ1IjoiZGFtb3NzIiwiYSI6ImNtNnRyZzk5MTA2NzkyaXExN2EyNTR1dWsifQ.UdaXenvYULYz6lkQbLU1hg';
      function initializeMap() {
        // Wait for the Flutter-created container in the DOM.
        const tryInitialize = (retries) => {
          const container = document.getElementById('mapbox-map');
          if (container) {
            const defaultLocation = [-122.4194, 37.7749]; // Fallback location.
            const map = new mapboxgl.Map({
              container: 'mapbox-map',
              style: 'mapbox://styles/mapbox/streets-v11',
              center: defaultLocation,
              zoom: 12
            });
            map.addControl(new mapboxgl.NavigationControl());
            const geolocateControl = new mapboxgl.GeolocateControl({
              positionOptions: { enableHighAccuracy: true },
              trackUserLocation: true,
              showUserHeading: true
            });
            map.addControl(geolocateControl);
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                (position) => {
                  const userCoordinates = [position.coords.longitude, position.coords.latitude];
                  map.flyTo({
                    center: userCoordinates,
                    zoom: 16,
                    speed: 1.2
                  });
                },
                (error) => {
                  console.error("Error fetching current location:", error);
                },
                { enableHighAccuracy: true }
              );
            }
          } else {
            if (retries > 0) {
              setTimeout(() => { tryInitialize(retries - 1); }, 500);
            } else {
              console.error("Container with id 'mapbox-map' not found after waiting.");
            }
          }
        };
        tryInitialize(10);
      }
      window.addEventListener('load', () => {
        // Delay initialization to ensure the Flutter element is in the DOM.
        setTimeout(initializeMap, 500);
      });
    </script>
  </head>
  <body>
    <!-- Flutter will inject its content here -->
    <script src="main.dart.js"></script>
  </body>
</html>
